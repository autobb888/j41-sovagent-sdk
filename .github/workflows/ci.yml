name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      # Audit 2026-06-02 M-SDK-supply-1: --frozen-lockfile so any unintended
      # lockfile drift is caught at CI time (especially relevant now that
      # verus-typescript-primitives is pinned by commit hash in package.json).
      - run: yarn install --frozen-lockfile

      - name: TypeScript build
        run: yarn build

      - name: Postinstall patches
        run: node scripts/postinstall.js
